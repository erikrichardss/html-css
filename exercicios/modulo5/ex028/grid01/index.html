<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    
    <style>
        div.container {
            border: 3px solid black;
            height: 200px;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            /* rows / collums 
            grid-template: 100px 100px 100px / auto auto auto; 
            grid-template: repeat(3, 100px) / repeat(3, auto);
            grid-templeta-collums: 1fr 2fr 1fr;
            grid-templeta-collums: 100px 20% repeat(2, 1fr);
            */

            gap: 5px;
            align-items: normal;
            justify-items: normal;
            /* itens - align / justify 
            place-items: normal normal; */

            align-content: normal;
            justify-content: normal;
            /* content - align / justify 
            place-content: normal normal; */
        }

        div.item {
            border: 3px solid brown;
            padding: 5px;            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
