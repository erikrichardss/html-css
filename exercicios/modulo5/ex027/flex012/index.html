<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flecible Box</title>

    <style>
        div.container {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        /* Flex = flex-grow + flex-shrink + flex-basis */

        div#caixaA {
           /*  flex-shrink: 1;
            flex-grow: 0;
            flex-basis: 200px; */

            flex: 0 1 200px;
        }

        div#caixaB {
            /* flex-shrink: 1;
            flex-grow: 2;
            flex-basis: 200px; */

            flex: 2 1 150px;
        }

        div#caixaC {
            /* flex-shrink: 1;
            flex-grow: 0;
            flex-basis: auto; */

            
            flex: 0 1 auto;
        }

        /* 
            flex: 0 1 auto = flex 
            initial

            flex: 0 0 auto = flex: none

            flex: 0 0 auto = flex: auto

            flex: 3 = flex: 3 1 auto
        */
    </style>
</head>

<body>
    <div class="container">
        <div class="item" id="caixaA">A</div>
        <div class="item" id="caixaB">B</div>
        <div class="item" id="caixaC">C</div>
    </div>
</body>

</html>
