<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de Formulário</h1>

    <!-- 
        Dentro do input
        required = requerido (serve para o usuário não submeter com campos vazios)

        minlength="" = dizer o minimo de caracteres
        maxlength="" = máximo de caracteres

        size="" = quantos caracteres irão aparecer

        placeholder="" = mensagem dentro da caixa de texto

        autocomplete="" = mais opções para específicar que tipo de caixa é aquela
    -->

    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário:</label>
            <input type="text" name="usu" id="isu" required minlength="3" maxlength="15" size="10" placeholder="Nome" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha</label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="8" placeholder="senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
