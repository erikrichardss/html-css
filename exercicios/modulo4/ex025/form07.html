<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <!-- 
        Não existe uma diferença simbólica entre o 'select' para o 'datalis', mas o 'datalist' te permite escrever e selecionar.

        'optgroup' usado para fazer grupos em 'options'

        'disabled' desabilitar um  'option'

        'textarea' > rows='' linhas > cols='' espaçamento > style="resize: none" para evitar que o usuário altere o tamanho da caixa > max-lenght='' limitar caracteres>
    -->
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iest">Estado:</label>
            <select name="est" id="iest" aria-placeholder="Escolha">
                <option value="" selected disabled>---Escolha---</option>
                <optgroup label="Região Sudeste">
                    <option value="sp">São Paulo</option>
                    <option value="jr">Rio de Janeiro</option>
                    <option value="mg">Minas Gerais</option>
                    <option value="es">Espírito Santo</option>
                </optgroup>

                <optgroup label="Região Sudeste">
                    <option value="mr">Maranhão</option>
                    <option value="pe">Pernâmbuco</option>
                    <option value="rn">Rio Grande do Norte</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="prof" id="iporf" list="istprof">
            <datalist id="istprof">
                <option>Administrador</option>
                <option>Contabilizador</option>
                <option>Desenvolvedor</option>
                <option>Professor</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem:</label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Sua Mensagem Aqui:" style="resize: none" maxlength="1000"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
