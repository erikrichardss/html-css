<body>
    <header>
        <section>
            <nav id="menu">
                <span class="material-symbols-outlined">menu</span>
                <ul class="lista">
                    <li>
                        <a href="#">Home</a>
                    </li>
                    <li>

                            </span>
                         </a>

    <main id="login">
        <section id="sign-up">
            <h1>Login</h1>

            <p>Não é um membro? <a href="#">Cadastrar</a></p>
        </section>
        
        <section>
            <form action="" autocomplete="on" method="post">
                <div id="formulario">
                    <input type="email" name="email" id="iemail" placeholder="Email" autocomplete="email" required>
                </div>
                <div id="formulario">
                    <input type="password" name="senha" id="isenha" placeholder="Senha" autocomplete="current-password" required min="8">
                </div>
                
                <input type="button" value="Logar">
                
            </form>

            <div>
                <p>Logar com</p>

                <div id="icones">
                    <img src="https://cdn-icons-png.freepik.com/128/300/300221.png" alt="">
                    <img src="https://cdn-icons-png.freepik.com/128/2190/2190355.png" alt="">
                </div>
            </div>
        </section>
    </main>
