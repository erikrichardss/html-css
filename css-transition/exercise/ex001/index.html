<!DOCTYPE html> 
<html lang="en">
    <head> 
        
        <title>Border Animation</title>

        <style>
            body {
            background-color: #000;
            margin: 0;
        }

        .parents {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .child {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            filter: blur(2px);
        }

        .child::before {
            content: "";
            position: absolute;
            inset: -20%;
            background: linear-gradient(0deg, transparent, red);
            animation: rotate 4s linear infinite forwards;
            z-index: 1;
        }

        .child::after {
            content: "";
            position: absolute;
            inset: 4px;
            background-color: rgb(34, 34, 34);
            border-radius: 16px;
            z-index: 1;
        }

        .child > * {
            position: relative;
            z-index: 4;
            color: white;
            padding: 2em;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        </style>
    </head>

    <body>
        <div class="parents">
            <div class="child">
                <div class="box"></div>
            </div>
        </div>
    </body>
</html>
